name: "Soufassistant"
version: "0.5.0"
slug: "soufassistant"
# Prebuilt by CI (.github/workflows/build.yml) and public on GHCR, so Supervisor
# pulls instead of building on the Green. CI publishes a version only when
# config.yaml names one GHCR lacks — bump `version` to release, and wait for
# the "Build app image" run to go green before updating in Home Assistant
# (an `image:` naming an unpublished version cannot be installed).
image: "ghcr.io/soufianeelfani/{arch}-soufassistant"
description: "Soufiane's personal AI assistant for Home Assistant — a Claude-powered assistant with Chat / Code / Cowork modes, several conversations at once, artifacts with Office/PDF previews, a configurable workspace, skills management, plan-usage meters, a task list, a reusable workspace, scheduled unattended prompts, a team / 1:1 tracker, and live HA control. Forked and extended from the open-source claude-code-ui project (see Credits in the README)."
url: "https://github.com/SoufianeElFani/soufassistant"
arch:
  - aarch64
  - amd64
startup: services
boot: manual
ingress: true
ingress_port: 7681
panel_icon: mdi:creation
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: manager
# Both legacy map types are gone: `config` was deprecated in Supervisor 2023.11
# (it mounted HA's config at /config) and `all_addon_configs` in 2026.07 (the
# add-on -> app rename). The explicit `path` on each keeps the in-container
# layout exactly as it was — `homeassistant_config` would otherwise mount at
# /homeassistant and `all_app_configs` at /app_configs. That matters: WORK_DIR,
# the persisted Claude session keys (~/.claude.json is keyed on the project dir
# /config) and the /addon_configs access guard in server/index.js are all
# written against these paths.
# NOTE: `all_app_configs` requires Supervisor 2026.07+; on older Supervisors this
# manifest is rejected outright (unknown map type).
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: all_app_configs
    read_only: false
    path: /addon_configs
# Keep multi-GB, tens-of-thousands-of-files build caches out of app backups.
# When ESPHome compiles, ESP-IDF/PlatformIO write GBs of small files under /data;
# including them in the nightly backup caused a tiny-file IO storm that starved
# the host watchdog and hard-reset the Pi. All excluded paths are reproducible
# (rebuilt on the next compile / esphome reinstall).
backup_exclude:
  - ".cache"
  - ".cache/**"
  - "esphome/.platformio"
  - "esphome/.platformio/**"
  - "esphome/venv"
  - "esphome/venv/**"
  - ".local/share/uv"
  - ".local/share/uv/**"
options:
  anthropic_api_key: ""
  default_permission_mode: ask
  ha_smart_context: true
  allow_addon_configs: false
  enable_esphome: false
  verbose_logging: false
  debug: false
schema:
  anthropic_api_key: str?
  default_permission_mode: "list(ask|plan|auto|acceptEdits|bypass)"
  ha_smart_context: bool
  allow_addon_configs: bool
  enable_esphome: bool
  verbose_logging: bool
  debug: bool
